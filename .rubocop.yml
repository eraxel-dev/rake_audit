AllCops:
  NewCops: enable
  TargetRubyVersion: 3.0
  SuggestExtensions: false
  Exclude:
    # Generator templates contain ERB and are not parseable as plain Ruby.
    - "lib/generators/**/templates/**/*"

# Specs are intentionally verbose and example-driven.
Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"

Metrics/MethodLength:
  Max: 20

Metrics/AbcSize:
  Max: 25

Style/Documentation:
  Enabled: true
